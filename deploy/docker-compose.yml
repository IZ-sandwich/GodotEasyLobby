# Production noray, for a Linux VPS.
#
# Uses host networking on purpose. noray needs 2048 UDP relay ports, and
# publishing that many through Docker's userland proxy makes `docker compose up`
# take minutes and wastes memory. Host networking hands them over for free.
#
# On Windows or macOS host networking is not properly supported, and publishing
# the ports instead does NOT work: Docker's userland proxy rewrites the UDP
# source address, so noray records the Docker gateway as the peer's public
# address and register_remote() times out. Run noray natively with bun there,
# see README.md. This file is for Linux.
#
# ARCHITECTURE: ghcr.io/foxssake/noray:main is published for linux/amd64 ONLY.
# There is no arm64 image. On ARM hosts comment out `image:` below and uncomment
# the `build:` block. noray's Dockerfile is FROM oven/bun:1, which IS multi-arch
# and noray has no native dependencies, so it builds and runs natively on arm64.

services:
  noray:
    image: ghcr.io/foxssake/noray:main
    # build:
    #   context: "https://github.com/foxssake/noray.git#main"
    container_name: noray
    restart: unless-stopped
    network_mode: host
    env_file:
      - noray.env

# Open these on the VPS firewall:
#   TCP 8890            control channel (clients register and request connections)
#   UDP 8809            registrar (clients announce their public address)
#   UDP 49152-51200     relay ports
#
# Leave TCP 8891 (metrics) closed to the internet, or bind it to localhost and
# reach it over an SSH tunnel. It is unauthenticated.
